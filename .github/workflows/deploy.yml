name: Import feeds and deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Import feeds (same workflow, so no second trigger is needed)
        run: python scripts/import_feeds.py
      - name: Commit imported content
        run: |
          git config user.name "feed-bot"; git config user.email "bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Import feeds [skip ci]" && git push) || true
      - name: Assemble site
        run: mkdir _site && cp -r index.html 404.html admin content assets robots.txt sitemap.xml CNAME _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
